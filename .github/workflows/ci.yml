name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install Luacheck
        run: luarocks install luacheck

      - name: luac5.1 syntax check
        # leafo/gh-actions-lua builds Lua from source and installs it as
        # plain `lua`/`luac` (no version suffix) - not the lua5.1/luac5.1
        # names apt's Debian-packaged Lua uses, which is what this
        # originally assumed (confirmed by the first real CI run failing
        # with "command not found": see docs/decision-log.md). It also
        # installs into a .lua/ directory inside the repo working copy,
        # and luarocks installs into .luarocks/ the same way - both need
        # excluding (and -type f, since -name '*.lua' also matches a
        # directory literally named ".lua") or this picks up the action's
        # own files, including a Lua 5.3-syntax vendor file from
        # luacheck's own dependencies that isn't our code to fix.
        run: |
          set -e
          find . -type f -name '*.lua' \
            -not -path './.lua/*' -not -path './.luarocks/*' \
            -not -path './lua_modules/*' -print0 \
            | xargs -0 -n1 luac -p

      - name: Luacheck
        run: luacheck .

      - name: Unit tests
        run: lua tests/run_tests.lua

      - name: wow-secret-lint
        # v1.8.1 fixed the bug that made this necessary: 16001 is now
        # correctly recognized as a retail (Forever) interface number
        # instead of being misread as Classic and skipped. TOC-based
        # discovery (path: .) works correctly as of v1.9.0 - confirmed
        # locally: flavour: "forever", filesScanned: 8 (matching the
        # real module count), 0 findings. This is an improvement over
        # the old explicit module list, which needed a manual update
        # every time a new module file was added to the TOC.
        uses: Booyaka101/wow-secret-lint@9aec64d53297fd1d26643d0a1455d60bd227f9c5 # v1.9.0
        with:
          path: "."
          args: "--strict"
