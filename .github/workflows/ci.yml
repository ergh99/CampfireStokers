name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install Luacheck
        run: luarocks install luacheck

      - name: luac5.1 syntax check
        # leafo/gh-actions-lua builds Lua from source and installs it as
        # plain `lua`/`luac` (no version suffix) - not the lua5.1/luac5.1
        # names apt's Debian-packaged Lua uses, which is what this
        # originally assumed (confirmed by the first real CI run failing
        # with "command not found": see docs/decision-log.md).
        run: |
          set -e
          find . -name '*.lua' -not -path './lua_modules/*' -print0 \
            | xargs -0 -n1 luac -p

      - name: Luacheck
        run: luacheck .

      - name: Unit tests
        run: lua tests/run_tests.lua

      - name: wow-secret-lint
        # TOC-based discovery skips this addon: its Interface line (16001)
        # isn't recognized as a retail number, so `path: .` reports "found
        # 1 .toc file(s), none targeting retail; nothing to check" and
        # exits 0 without scanning anything. Pointing it at the module
        # files directly bypasses that discovery and scans for real
        # (confirmed locally: filesScanned: 8, matching the module count).
        uses: Booyaka101/wow-secret-lint@e59a34337491d40cc53adc504bb2c51c580d20eb # v1.8.0
        with:
          path: "Core.lua Data.lua Detection.lua Launcher.lua Options.lua Send.lua Tree.lua UI.lua"
          args: "--strict"
